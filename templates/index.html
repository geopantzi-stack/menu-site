<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <title>{{ category }}</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body {

            font-family: Arial, sans-serif;
            text-align: center;

            background:
                linear-gradient(rgba(0,0,0,0.50), rgba(0,0,0,0.50)),
                url("/static/{{ category }}.png");

            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;

            min-height: 100vh;

            color:white;

            padding:40px 20px;
        }

        h1{

            font-size:3em;
            margin-bottom:40px;

            text-transform:uppercase;

            text-shadow:2px 2px 10px rgba(0,0,0,0.8);

        }

        .products{

            max-width:700px;
            margin:auto;

            display:flex;
            flex-direction:column;

            gap:20px;

        }

        .product{

            background:rgba(0,0,0,0.45);

            border-radius:15px;

            padding:20px;

            backdrop-filter: blur(3px);

            border:1px solid rgba(255,255,255,0.2);

            box-shadow:0 8px 20px rgba(0,0,0,0.4);

            transition:0.3s;
        }

        .product:hover{

            transform:translateY(-5px);

            background:rgba(0,0,0,0.60);

        }

        .name{

            font-size:1.5em;
            font-weight:bold;

            margin-bottom:10px;
        }

        .price{

            font-size:1.2em;

            color:#ffd369;

            font-weight:bold;
        }

        .desc{

            margin-top:10px;

            color:#ddd;
        }

        .back{

            display:inline-block;

            margin-top:40px;

            text-decoration:none;

            color:white;

            background:rgba(0,0,0,0.5);

            padding:15px 25px;

            border-radius:10px;

            transition:0.3s;
        }

        .back:hover{

            background:rgba(255,255,255,0.2);

        }

    </style>
</head>

<body>

    <h1>{{ category }}</h1>

    <div class="products">

        {% for product in products %}

        <div class="product">

            <div class="name">
                {{ product.name }}
            </div>

            <div class="price">
                {{ product.price }} €
            </div>

            {% if product.description %}
            <div class="desc">
                {{ product.description }}
            </div>
            {% endif %}

        </div>

        {% endfor %}

    </div>

    <a href="/" class="back">
        ← Επιστροφή
    </a>

</body>
</html>
